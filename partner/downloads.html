<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Kit | PR4Shopping</title>
    <style>
        /* --- YOUR ORIGINAL STYLES --- */
        body { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; line-height: 1.6; color: #333; margin: 0; padding: 0; }
        header { background: #fff; padding: 20px 5%; border-bottom: 3px solid #cc0000; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 26px; font-weight: bold; text-decoration: none; }
        .logo-pr4 { color: #cc0000; }
        .logo-shopping { color: #000; }
        nav a { margin-left: 20px; text-decoration: none; color: #000; font-weight: bold; transition: 0.2s; }
        nav a:hover { color: #cc0000; }
        .container { padding: 50px 5%; max-width: 1100px; margin: auto; }
        h2 { color: #000; font-size: 2rem; margin-bottom: 25px; }
        .btn { background: #cc0000; color: #fff; padding: 12px 25px; text-decoration: none; display: inline-block; font-weight: bold; border-radius: 5px; font-size: 0.9rem; transition: 0.2s; border: none; cursor: pointer; }
        .btn:hover { background: #000; }
        footer { background: #eee; padding: 40px 5%; text-align: center; font-size: 14px; margin-top: 50px; border-top: 1px solid #ddd; }

        /* --- MEDIA KIT SPECIFIC STYLES --- */
        .asset-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; margin-top: 40px; }
        .asset-card { background: #fff; border: 1px solid #ddd; border-top: 5px solid #cc0000; border-radius: 8px; padding: 20px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
        
        /* Preview container: Constrains the image size */
        .preview-box { width: 100%; height: 200px; display: flex; align-items: center; justify-content: center; background: #f9f9f9; margin-bottom: 15px; overflow: hidden; border-radius: 4px; border: 1px inset #eee; }
        .preview-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        .asset-card h3 { font-size: 1.1rem; margin: 10px 0; color: #000; }
        .asset-info { font-size: 12px; color: #666; margin-bottom: 15px; text-transform: uppercase; font-weight: bold; }
        
        .zip-box { background: #000; color: #fff; padding: 30px; border-radius: 8px; margin-bottom: 40px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; }
        .zip-box h2 { color: #fff; margin: 0; font-size: 1.5rem; }
        .zip-box p { margin: 5px 0 0; color: #ccc; }
    </style>
</head>
<body>
