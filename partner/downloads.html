<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Kit | PR4Shopping</title>
    <style>
        /* --- BRAND STYLE SYNC --- */
        body { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; line-height: 1.6; color: #333; margin: 0; padding: 0; background: #fff; }
        header { background: #fff; padding: 20px 5%; border-bottom: 3px solid #cc0000; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 26px; font-weight: bold; text-decoration: none; }
        .logo-pr4 { color: #cc0000; }
        .logo-shopping { color: #000; }
        
        nav a { margin-left: 20px; text-decoration: none; color: #000; font-weight: bold; transition: 0.2s; }
        nav a:hover { color: #cc0000; }

        .jp-link-only { display: none; }
        @media (min-width: 1024px) { .jp-link-only { display: inline-block; } }

        .container { padding: 40px 5%; max-width: 1100px; margin: auto; }
        
        /* --- PAGE SPECIFIC --- */
        .page-title { font-size: 2.5rem; font-weight: bold; margin-bottom: 10px; color: #000; }
        
        .instructions { background: #f4f4f4; padding: 30px; border-radius: 8px; border-left: 5px solid #cc0000; margin-bottom: 40px; }
        .instructions h3 { margin-top: 0; color: #cc0000; }
        .instructions ul { padding-left: 20px; margin-bottom: 0; }

        .zip-cta { background: #000; color: #fff; padding: 25px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 50px; flex-wrap: wrap; gap: 20px; }
        .zip-cta h4 { margin: 0; font-size: 1.4rem; }

        /* --- THE IMAGE GRID --- */
        .asset-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 25px; }
        .asset-card { border: 1px solid #eee; padding: 15px; border-radius: 8px; text-align: center; transition: 0.3s; display: flex; flex-direction: column; }
        .asset-card:hover { border-color: #cc0000; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        
        .img-preview { width: 100%; height: 180px; background: #f9f9f9; display: flex; align-items: center; justify-content: center; margin-bottom: 15px; border-radius: 4px; overflow: hidden; }
        .img-preview img { max-width: 100%; max-height: 100%; object-fit: contain; }

        .asset-name { font-weight: bold; font-size: 0.95rem; margin-bottom: 5px; min-height: 40px; display: flex; align-items: center; justify-content: center; }
        .file-type { font-size: 11px; color: #999; text-transform: uppercase; margin-bottom: 15px; }
