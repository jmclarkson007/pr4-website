<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <title>City Performance Report | PR4Shopping</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Professional, clean typography for council reports */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; 
            line-height: 1.6; 
            color: #1a1a1a; 
            max-width: 800px; 
            margin: 0 auto; 
            padding: 40px 20px;
            background-color: #fff;
        }

        .header { 
            border-bottom: 2px solid #cc0000; 
            padding-bottom: 10px; 
            margin-bottom: 30px; 
        }

        .brand { font-size: 24px; font-weight: 800; text-decoration: none; color: #000; }
        .brand span { color: #cc0000; }

        .report-section { margin-bottom: 25px; }

        .data-row { 
            display: flex; 
            justify-content: flex-start; 
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .label { 
            font-weight: 700; 
            width: 300px; 
            color: #444;
        }

        .value { 
            font-weight: 800; 
            font-size: 1.1rem;
            color: #000;
        }

        .disclaimer { 
            margin-top: 40px; 
            padding: 20px; 
            background: #f9f9f9; 
            border-left: 4px solid #cc0000;
            font-size: 0.95rem;
            font-style: italic;
        }

        #status-indicator { font-size: 10px; color: #ccc; margin-top: 50px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand"><span>PR4</span>Shopping</div>
    </div>

    <div class="report-section">
        <div class="data-row">
            <div class="label">Council Name:</div>
            <div class="value" id="city-name">Loading...</div>
        </div>
        <div class="data-row">
            <div class="label">Number of Active Businesses:</div>
            <div class="value" id="shop-count">0</div>
        </div>
        <div class="data-row">
            <div class="label">Number of Redeemed Discounts:</div>
            <div class="value" id="redemption-count">0</div>
        </div>
    </div>

    <div class="disclaimer">
        The estimate number of redeemed discounts represents the number of cars that did not travel into your city and spent money helping to reinvigorate your economy.
    </div>

    <div id="status-indicator">Report Status: Connected</div>

    <script>
        const SUPABASE_URL = 'https://cocjolczajrnikiwolly.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_AEPtmbQAf0U4_1gXLsAoLA_-HOM-3_w';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function updateReport() {
            const urlParams = new URLSearchParams(window.location.search);
            const cityQuery = urlParams.get('city');

            if (!cityQuery) {
                document.getElementById('city-name').innerText = "City parameter missing";
                return;
            }

            // Set the Council Name
            document.getElementById('city-name').innerText = cityQuery.charAt(0).toUpperCase() + cityQuery.slice(1);

            const { data, error } = await supabaseClient
                .from('Registrations_Database')
                .select('city, is_active, customer_count');

            if (error) {
                console.error(error);
                return;
            }

            if (data) {
                const cityRows = data.filter(r => 
                    r.city && r.city.toLowerCase().trim() === cityQuery.toLowerCase().trim()
                );

                const activeCount = cityRows.filter(r => r.is_active === true).length;
                const totalSum = cityRows.reduce((sum, row) => sum + (Number(row.customer_count) || 0), 0);

                document.getElementById('shop-count').innerText = activeCount.toLocaleString();
                document.getElementById('redemption-count').innerText = totalSum.toLocaleString();
            }
        }

        updateReport();
        // Refresh every 30 seconds for reports (no need for 5 seconds now)
        setInterval(updateReport, 30000);
    </script>
</body>
</html>
