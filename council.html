<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <title>Performance Overview | PR4Shopping</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #fff; color: #000; }
        header { padding: 20px 5%; border-bottom: 3px solid #cc0000; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 26px; font-weight: bold; text-decoration: none; color: #000; }
        .logo-pr4 { color: #cc0000; }
        
        .gold-rim { border: 1px solid #D4AF37; }
        .metric-card { padding: 80px 20px; text-align: center; border-radius: 4px; background: #fff; }
        .label { color: #cc0000; font-weight: 900; text-transform: uppercase; letter-spacing: 3px; font-size: 12px; margin-bottom: 15px; }
        .big-number { font-size: 140px; font-weight: 900; line-height: 1; font-style: italic; letter-spacing: -6px; color: #000; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo"><span class="logo-pr4">PR4</span>Shopping</a>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-20">
        <div class="mb-16 border-l-8 border-black pl-10">
            <h1 class="text-8xl font-black uppercase tracking-tighter" id="city-title">...</h1>
            <p class="text-slate-400 font-bold uppercase tracking-widest text-sm mt-4">Verified Scheme Usage</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
            <div class="metric-card gold-rim">
                <p class="label">Registered Merchants</p>
                <p class="big-number" id="shop-count">0</p>
                <p class="text-[10px] font-bold uppercase mt-6 text-slate-400">Active in Region</p>
            </div>

            <div class="metric-card border border-slate-200">
                <p class="label">Total Redemptions</p>
                <p class="big-number" id="redemption-count">0</p>
                <p class="text-[10px] font-bold uppercase mt-6 text-slate-400">Live Customer Count</p>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // This pulls "Bath" or "Bristol" from the URL (?city=Bath)
        const urlParams = new URLSearchParams(window.location.search);
        const cityParam = urlParams.get('city') || 'Bath'; 
        document.getElementById('city-title').innerText = cityParam;

        async function updateData() {
            // THE FILTER: Only rows where city matches the URL
            const { data, error } = await supabaseClient
                .from('Registrations_Database')
                .select('is_active, customer_count, city')
                .eq('city', cityParam);

            if (error) {
                console.error("Fetch error:", error);
                return;
            }

            if (data) {
                // THE SHOP COUNT: Count how many are marked active
                const activeShops = data.filter(row => row.is_active === true).length;
                
                // THE MATH: Sum up every single 'customer_count' for the filtered city
                const totalPunches = data.reduce((total, row) => {
                    return total + (Number(row.customer_count) || 0);
                }, 0);

                // UPDATE UI
                document.getElementById('shop-count').innerText = activeShops;
                document.getElementById('redemption-count').innerText = totalPunches;
            }
        }

        // Run immediately
        updateData();
        // Refresh every 5 seconds
        setInterval(updateData, 5000);
    </script>
</body>
</html>
