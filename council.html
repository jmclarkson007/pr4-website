<script>
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function runUpdate() {
        // 1. Get city from URL
        const params = new URLSearchParams(window.location.search);
        const cityFromUrl = params.get('city');

        if (!cityFromUrl) {
            document.getElementById('city-title').innerText = "URL MISSING CITY";
            return;
        }

        document.getElementById('city-title').innerText = cityFromUrl.toUpperCase();

        // 2. Fetch all data from the Registrations_Database
        const { data, error } = await supabaseClient
            .from('Registrations_Database')
            .select('city, is_active, customer_count');

        if (error) {
            console.error("Fetch Error:", error.message);
            return;
        }

        if (data) {
            // 3. FILTER for the chosen city (e.g., Bath)
            const matches = data.filter(row => 
                row.city && row.city.trim().toLowerCase() === cityFromUrl.trim().toLowerCase()
            );

            // 4. COUNT Active rows
            const activeCount = matches.filter(row => row.is_active === true).length;

            // 5. SUM all customer_count numbers for that city
            const totalSum = matches.reduce((acc, row) => acc + (Number(row.customer_count) || 0), 0);

            // Update UI
            document.getElementById('shop-count').innerText = activeCount;
            document.getElementById('redemption-count').innerText = totalSum;
        }
    }

    runUpdate();
    setInterval(runUpdate, 5000); // Live refresh every 5 seconds
</script>
