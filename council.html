<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <title>City Performance Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #fff; color: #000; }
        header { padding: 20px 5%; border-bottom: 3px solid #cc0000; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 26px; font-weight: bold; text-decoration: none; color: #000; }
        .logo-pr4 { color: #cc0000; }
        .gold-rim { border: 1px solid #D4AF37; }
        .metric-card { padding: 80px 20px; text-align: center; border-radius: 4px; }
        .label { color: #cc0000; font-weight: 900; text-transform: uppercase; letter-spacing: 3px; font-size: 14px; margin-bottom: 15px; }
        .big-number { font-size: 140px; font-weight: 900; line-height: 1; font-style: italic; letter-spacing: -6px; color: #000; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo"><span class="logo-pr4">PR4</span>Shopping</a>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-20">
        <div class="mb-16 border-l-8 border-black pl-10">
            <h1 class="text-8xl font-black uppercase tracking-tighter" id="city-title">...</h1>
            <p class="text-slate-400 font-bold uppercase tracking-widest text-sm mt-4">Annual Period: April 6th — April 5th</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
            <div class="metric-card gold-rim">
                <p class="label">Active Merchants</p>
                <p class="big-number" id="shop-count">0</p>
            </div>

            <div class="metric-card border border-slate-200">
                <p class="label">Total Redemptions</p>
                <p class="big-number" id="redemption-count">0</p>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function updateDashboard() {
            // Get city from URL (e.g. ?city=Bath)
            const params = new URLSearchParams(window.location.search);
            const city = params.get('city');

            if (!city) {
                document.getElementById('city-title').innerText = "Select City";
                return;
            }

            document.getElementById('city-title').innerText = city;

            // PULL DATA: Points to Registrations_Database only
            const { data, error } = await supabaseClient
                .from('Registrations_Database')
                .select('city, is_active, customer_count');

            if (data) {
                // STEP 1: Filter the list to only the chosen city (e.g., Bath)
                const cityRows = data.filter(r => 
                    r.city && r.city.trim().toLowerCase() === city.trim().toLowerCase()
                );

                // STEP 2: Count how many of those rows are is_active
                const activeCount = cityRows.filter(r => r.is_active === true).length;

                // STEP 3: Sum the customer_count for every row in that city
                const totalRedemptions = cityRows.reduce((acc, row) => {
                    return acc + (Number(row.customer_count) || 0);
                }, 0);

                // Display the results
                document.getElementById('shop-count').innerText = activeCount;
                document.getElementById('redemption-count').innerText = totalRedemptions;
            }
        }

        updateDashboard();
        // Check for updates every 5 seconds
        setInterval(updateDashboard, 5000);
    </script>
</body>
</html>
