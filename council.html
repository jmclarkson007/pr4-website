<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <title>Performance Overview | PR4Shopping</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #fff; color: #000; }
        header { padding: 20px 5%; border-bottom: 3px solid #cc0000; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 26px; font-weight: bold; text-decoration: none; color: #000; }
        .logo-pr4 { color: #cc0000; }
        nav a { margin-left: 20px; text-decoration: none; color: #000 !important; font-weight: bold; }
        
        .gold-rim { border: 1px solid #D4AF37; }
        .metric-card { padding: 80px 20px; text-align: center; transition: 0.3s; }
        .label { color: #cc0000; font-weight: 900; text-transform: uppercase; letter-spacing: 3px; font-size: 12px; margin-bottom: 20px; }
        .big-number { font-size: 140px; font-weight: 900; line-height: 1; font-style: italic; letter-spacing: -6px; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo"><span class="logo-pr4">PR4</span>Shopping</a>
        <nav>
            <a href="index.html">Partnership</a>
            <a href="about.html">About</a>
        </nav>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-20">
        <div class="mb-16 border-l-8 border-black pl-10">
            <h1 class="text-8xl font-black uppercase tracking-tighter" id="city-title">...</h1>
            <p class="text-slate-400 font-bold uppercase tracking-widest text-sm mt-4">Verified Scheme Usage</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
            <div class="metric-card gold-rim">
                <p class="label">Registered Merchants</p>
                <p class="big-number" id="shop-count">0</p>
                <p class="text-[10px] font-bold uppercase mt-6 text-slate-300">Active in Region</p>
            </div>

            <div class="metric-card bg-black text-white">
                <p class="label">Total Redemptions</p>
                <p class="big-number text-red-600" id="redemption-count">0</p>
                <p class="text-[10px] font-bold uppercase mt-6 text-slate-500">Live Customer Count</p>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const city = urlParams.get('city') || 'Bath';
        document.getElementById('city-title').innerText = city;

        async function updatePerformance() {
            // Fetch all merchants for the current city
            const { data, error } = await supabaseClient
                .from('Registrations_Database')
                .select('is_active, customer_count')
                .eq('city', city);

            if (data) {
                // 1. Count active merchants
                const activeShops = data.filter(row => row.is_active === true).length;
                
                // 2. Sum the 'customer_count' (the punches from the app)
                const totalRedemptions = data.reduce((acc, row) => acc + (Number(row.customer_count) || 0), 0);

                // Update the screen
                document.getElementById('shop-count').innerText = activeShops;
                document.getElementById('redemption-count').innerText = totalRedemptions;
            }
        }

        updatePerformance();
        // Refresh every 5 seconds so you can see the test redemption hit the screen
        setInterval(updatePerformance, 5000);
    </script>
</body>
</html>
