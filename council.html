<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <title>City Monitoring | PR4Shopping</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #fff; color: #000; }
        header { padding: 20px 5%; border-bottom: 3px solid #cc0000; }
        .logo { font-size: 26px; font-weight: bold; text-decoration: none; color: #000; }
        .logo-pr4 { color: #cc0000; }
        .gold-rim { border: 1px solid #D4AF37; }
        .metric-card { padding: 80px 20px; text-align: center; }
        .label { color: #cc0000; font-weight: 900; text-transform: uppercase; letter-spacing: 3px; font-size: 14px; margin-bottom: 15px; }
        .big-number { font-size: 140px; font-weight: 900; line-height: 1; font-style: italic; letter-spacing: -6px; color: #000; }
        #debug-log { position: fixed; bottom: 0; left: 0; width: 100%; background: #f1f1f1; font-size: 10px; color: #666; padding: 5px; border-top: 1px solid #ccc; }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo"><span class="logo-pr4">PR4</span>Shopping</a>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-20">
        <div class="mb-16 border-l-8 border-black pl-10">
            <h1 class="text-8xl font-black uppercase tracking-tighter" id="city-title">...</h1>
            <p class="text-slate-400 font-bold uppercase tracking-widest text-sm mt-4">Annual Performance Overview</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
            <div class="metric-card gold-rim">
                <p class="label">Active Merchants</p>
                <p class="big-number" id="shop-count">0</p>
            </div>

            <div class="metric-card border border-slate-200">
                <p class="label">Total Redemptions</p>
                <p class="big-number" id="redemption-count">0</p>
            </div>
        </div>
    </main>

    <div id="debug-log">Status: Initializing...</div>

    <script>
        // CREDENTIALS PLUGGED IN
        const SUPABASE_URL = 'https://cocjolczajrnikiwolly.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_AEPtmbQAf0U4_1gXLsAoLA_-HOM-3_w';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function updateDashboard() {
            const log = document.getElementById('debug-log');
            
            // 1. Get City from URL (?city=Bath)
            const urlParams = new URLSearchParams(window.location.search);
            const cityQuery = urlParams.get('city');

            if (!cityQuery) {
                document.getElementById('city-title').innerText = "NO CITY IN URL";
                log.innerText = "Error: Please add ?city=Bath to your browser address bar.";
                return;
            }

            document.getElementById('city-title').innerText = cityQuery.toUpperCase();

            // 2. Fetch from Database
            log.innerText = "Status: Fetching data for " + cityQuery + "...";
            
            const { data, error } = await supabaseClient
                .from('Registrations_Database')
                .select('city, is_active, customer_count');

            if (error) {
                log.innerText = "Database Error: " + error.message;
                return;
            }

            if (data) {
                // 3. Filter for city matching URL
                const filteredRows = data.filter(r => 
                    r.city && r.city.toLowerCase().trim() === cityQuery.toLowerCase().trim()
                );

                // 4. Count Active (is_active is TRUE)
                const activeCount = filteredRows.filter(r => r.is_active === true).length;

                // 5. Sum Redemptions (customer_count)
                const totalSum = filteredRows.reduce((sum, row) => sum + (Number(row.customer_count) || 0), 0);

                // Update UI
                document.getElementById('shop-count').innerText = activeCount;
                document.getElementById('redemption-count').innerText = totalSum;
                log.innerText = "Status: Success. Found " + filteredRows.length + " total records for " + cityQuery;
            }
        }

        updateDashboard();
        // Refresh every 10 seconds to keep it live
        setInterval(updateDashboard, 10000);
    </script>
</body>
</html>
